kind = "web"
  previewPath = "/"
  title = "CharComp — Character Comparison Platform"
  version = "1.0.0"
  id = "artifacts/charcomp"
  router = "path"

  [[integratedSkills]]
  name = "react-vite"
  version = "1.0.0"

  [[services]]
  name = "web"
  paths = [ "/" ]
  localPort = 18740

  [services.development]
  run = "pnpm --filter @workspace/charcomp run dev"

  [services.production]
  build = [ "pnpm", "--filter", "@workspace/charcomp", "run", "build" ]
  publicDir = "artifacts/charcomp/dist/public"
  serve = "static"

  [[services.production.rewrites]]
  from = "/*"
  to = "/index.html"

  [services.env]
  PORT = "18740"
  BASE_PATH = "/"
  